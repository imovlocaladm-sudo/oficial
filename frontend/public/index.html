    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        
        <!-- Bloquear e remover badges externos -->
        <style>
            #emergent-badge,
            [id*="emergent"],
            [class*="emergent"],
            a[href*="emergent.sh"],
            a[href*="emergentagent"] {
                display: none !important;
                visibility: hidden !important;
                opacity: 0 !important;
                pointer-events: none !important;
                width: 0 !important;
                height: 0 !important;
                position: absolute !important;
                left: -9999px !important;
            }
        </style>
        <script>
            // Remover badge Emergent imediatamente e prevenir reinjeção
            (function() {
                function removeBadge() {
                    var badge = document.getElementById('emergent-badge');
                    if (badge) badge.remove();
                    
                    // Remover qualquer elemento com emergent no id ou classe
                    document.querySelectorAll('[id*="emergent"], [class*="emergent"], a[href*="emergent"]').forEach(function(el) {
                        el.remove();
                    });
                }
                
                // Executar imediatamente
                removeBadge();
                
                // Executar quando DOM carregar
                document.addEventListener('DOMContentLoaded', removeBadge);
                
                // Observar mudanças no DOM para remover badges injetados dinamicamente
                var observer = new MutationObserver(function(mutations) {
                    removeBadge();
                });
                
                observer.observe(document.documentElement, {
                    childList: true,
                    subtree: true
                });
                
                // Executar periodicamente nos primeiros segundos
                setTimeout(removeBadge, 100);
                setTimeout(removeBadge, 500);
                setTimeout(removeBadge, 1000);
                setTimeout(removeBadge, 2000);
            })();
        </script>
